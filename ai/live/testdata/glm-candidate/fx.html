<script>
$(function(){
    var initReady = setInterval(function(){
      if ('san' in window) {
          clearInterval(initReady);
          doJumptoByDatafor();
      }
    },10);
    
    
    var ccprContentInterval = setInterval(function(){
        if(READY_GO){
            clearInterval(ccprContentInterval);
            //var searchDate = getQueryStr('searchDate');
            var searchDate = queryUrl('searchDate');
            $.ajax({
                url:DURL+'fx/ccpr-notice'+searchDate+'.json',
                type:'post',
                dataType:'json'
            }).done(function(data){
                var title = data.data.vo.showDateForCn+'中国外汇交易中心受权公布人民币汇率中间价公告';
                $('#notice-title').text(title);
                var content = '中国人民银行授权中国外汇交易中心公布，'+data.data.vo.showDateForCn+'银行间外汇市场人民币汇率中间价为'+data.data.vo.price;
                $('#notice-content').html('&nbsp;&nbsp;'+content);
                $('#notice-date').text(data.data.vo.showDateForCn);
                
                $(document).attr('title',title+'_中国货币网');
                $('meta[name="keywords"]').attr('content',title);
                $('meta[name="description"]').attr('content',content.substring(0,54));

            })
        }
    },10)
	
});
</script>
